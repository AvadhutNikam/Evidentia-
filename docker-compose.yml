version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidentia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
      - DISABLE_EMBEDDED_WORKER=true
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,https://evidentia-ai.vercel.app,https://evidentia-ai.netlify.app
      - DATABASE_URL=sqlite:///evidentia.db
    env_file:
      - ./backend/.env
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app/evidentia_data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evidentia-worker
    command: ["python", "worker.py"]
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///evidentia.db
    env_file:
      - ./backend/.env
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app/evidentia_data
    depends_on:
      - backend

volumes:
  backend-uploads:
  backend-db:
